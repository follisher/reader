name: reader
description: Reusable EPUB and TXT bookshelf and reader.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  archive: ^3.6.1
  xml: ^6.6.1
  html: ^0.15.6
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  # 2.3 migrates to JNI and adds a CMake requirement; keep this reader lightweight.
  path_provider_android: '>=2.2.20 <2.3.0'
  sqflite: ^2.4.2
  file_selector: ^1.1.0
  # 12.x applies a legacy kotlin-android plugin that conflicts with the
  # consuming app's AGP 9 built-in Kotlin setup.
  share_plus:  ^13.3.0
  url_launcher: ^6.3.2
  flutter_widget_from_html_core: ^0.17.0
  scrollable_positioned_list: ^0.3.8
  flutter_book_reader:
    path: third_party/flutter_book_reader
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

# Tests use the host SQLite library, avoiding a build-time binary download.
hooks:
  user_defines:
    sqlite3:
      source: system
